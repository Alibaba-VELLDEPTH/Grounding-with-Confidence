<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Grounding with Confidence</title>
  <desc id="desc">A deep-green wordmark with a schematic of temporal intervals and confidence indicators. Decorative illustration, not model predictions.</desc>

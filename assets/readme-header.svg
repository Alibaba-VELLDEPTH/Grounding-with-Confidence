  <text x="48" y="48" fill="#c3d4c6" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.5">ONE DECODE. MANY DECISIONS.</text>
  <text x="45" y="112" fill="#f8f5e9" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="600" letter-spacing="-1.8">Grounding with</text>
  <text x="44" y="193" fill="#d1e3ab" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-style="italic" letter-spacing="-2">Confidence.</text>
